name: Publish
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"
      - name: Update version in build.gradle.kts
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" build.gradle.kts
          cat build.gradle.kts | grep "version ="
      - name: Build artifacts
        run: gradle build
      - name: Publish to GitHub Packages
        run: gradle publish --no-daemon
      - name: Build standalone JS bundle
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          gradle buildStandaloneBundle --no-daemon
          mkdir -p build/dist
          cp src/main/webapp/labs-bundle/dist/sayaya-ui.js build/dist/sayaya-ui-$VERSION.js
          (cd build/dist && sha256sum sayaya-ui-$VERSION.js > sayaya-ui-$VERSION.js.sha256)
          head -c 300 build/dist/sayaya-ui-$VERSION.js; echo
      - name: Build feedback ESM bundle
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          gradle buildFeedbackBundle --no-daemon
          cp src/main/webapp/labs-bundle/dist/sayaya-ui-feedback.js build/dist/sayaya-ui-feedback-$VERSION.js
          (cd build/dist && sha256sum sayaya-ui-feedback-$VERSION.js > sayaya-ui-feedback-$VERSION.js.sha256)
          head -c 300 build/dist/sayaya-ui-feedback-$VERSION.js; echo
      - name: Build navigation ESM bundle
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          gradle buildNavigationBundle --no-daemon
          cp src/main/webapp/labs-bundle/dist/sayaya-ui-navigation.js build/dist/sayaya-ui-navigation-$VERSION.js
          (cd build/dist && sha256sum sayaya-ui-navigation-$VERSION.js > sayaya-ui-navigation-$VERSION.js.sha256)
          head -c 300 build/dist/sayaya-ui-navigation-$VERSION.js; echo
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/libs/*.jar
            build/dist/sayaya-ui-*.js
            build/dist/sayaya-ui-*.js.sha256
          body: |
            ## Material Design 3 UI Components for GWT ${{ steps.version.outputs.VERSION }}

            GWT에서 Material Design 3 컴포넌트를 사용할 수 있도록 래핑한 라이브러리입니다.

            ### 주요 컴포넌트
            - ✅ Badge, Button, Card, Checkbox, Chip
            - ✅ Dialog, Divider, FAB, Icon, List
            - ✅ Menu, Progress, Radio, Ripple, Select
            - ✅ Slider, Switch, Tabs, TextField
            - ✅ Top app bar, Navigation bar, Navigation rail, Navigation drawer
            - ✅ Tooltip (plain/rich), Snackbar, Button group (standard/connected), Side sheet (standard/modal), Bottom sheet (standard/modal)
            - ✅ Expressive (labs/gb) 16종: md-gb-button, md-gb-split-button, md-gb-icon-button, md-gb-fab 등

            ### Maven 좌표 (GitHub Packages)
            ```gradle
            // settings.gradle.kts
            dependencyResolutionManagement {
                repositories {
                    maven {
                        url = uri("https://maven.pkg.github.com/sayaya1090/maven")
                        credentials {
                            username = project.findProperty("github_username") as String? ?: System.getenv("GITHUB_USERNAME")
                            password = project.findProperty("github_password") as String? ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }

            // build.gradle.kts
            dependencies {
                implementation("dev.sayaya:ui:${{ steps.version.outputs.VERSION }}")
            }
            ```

            ### 단일 JS 번들 (CDN 불필요)
            `sayaya-ui-${{ steps.version.outputs.VERSION }}.js` 는 `@material/web/all.js` 와 sayaya-ui labs 번들(IIFE)을 이 순서로 이어 붙인 classic script 입니다.
            GWT 앱보다 먼저 `<script src="sayaya-ui-${{ steps.version.outputs.VERSION }}.js"></script>` 로 한 번 로드하세요. 체크섬은 `.sha256` 첨부물을 확인하세요.

            ### 단독 feedback ESM 번들 (Material Web 을 따로 싣는 앱용)
            `sayaya-ui-feedback-${{ steps.version.outputs.VERSION }}.js` 는 `md-tooltip`, `md-snackbar`, `md-toast` 만 정의하는 ES module 입니다(lit 포함, @material/web 컴포넌트·md-button-group 미포함). 각 정의는 이름이 이미 등록돼 있으면 건너뜁니다.
            앱의 Material Web 번들 뒤에 `<script type="module" src="sayaya-ui-feedback-${{ steps.version.outputs.VERSION }}.js"></script>` 로 로드하세요.

            ### 단독 navigation ESM 번들 (Material Web 을 따로 싣는 앱용)
            `sayaya-ui-navigation-${{ steps.version.outputs.VERSION }}.js` 는 `md-top-app-bar`, `md-navigation-rail`, `md-navigation-rail-item`, `md-navigation-bar`, `md-navigation-tab` 만 정의하는 ES module 입니다(lit 포함, @material/web 컴포넌트·md-navigation-drawer 미포함). 각 정의는 이름이 이미 등록돼 있으면 건너뜁니다.
            레일 내장 메뉴 버튼(`menu`)은 `md-icon-button` 을 쓰므로 앱이 Material Web icon-button 을 함께 실어야 합니다(메뉴 아이콘은 기본 SVG라 아이콘 폰트는 필요 없음). 앱의 Material Web 번들 뒤에 `<script type="module" src="sayaya-ui-navigation-${{ steps.version.outputs.VERSION }}.js"></script>` 로 로드하세요.

            ### 변경사항
            자세한 변경사항은 커밋 히스토리를 확인해주세요.
          draft: false
          prerelease: false